<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crisp Chick Scanner</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#211c19;color:white;display:flex;justify-content:center}
.wrap{width:min(560px,100%);padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.brand{text-align:center}.brand img{width:110px;height:110px;object-fit:contain}.brand h1{margin:0;font-size:clamp(25px,7vw,34px)}.sub{color:#cfc4bd}
.box{background:#fff;color:#222;border-radius:22px;padding:14px;margin-top:18px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.reader{width:100%;min-height:280px;border-radius:16px;overflow:hidden;background:#111}
.status{padding:12px;border-radius:12px;background:#f3ece6;color:#333;margin-top:12px;line-height:1.4;overflow-wrap:anywhere}
.btn{width:100%;min-height:48px;padding:14px;border:0;border-radius:12px;background:#e8563f;color:white;font-weight:800;margin-top:12px;touch-action:manipulation}
@media(max-width:600px){.wrap{padding-left:11px;padding-right:11px}.brand img{width:82px;height:82px}.box{margin-top:12px;padding:10px;border-radius:18px}.reader{min-height:250px;border-radius:13px}.status{font-size:13px}.btn{min-height:50px}}
@media(max-width:380px){.brand img{width:70px;height:70px}.brand h1{font-size:24px}.reader{min-height:225px}}
</style></head><body><div class="wrap"><div class="brand"><img src="logo.jpg"><h1>CRISP CHICK</h1><div class="sub">Barcode Scanner</div></div><div class="box"><div id="reader" class="reader"></div><div id="status" class="status">Tekan tombol jika kamera belum aktif.</div><button id="start" class="btn">Aktifkan Kamera</button></div></div><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>const target=new URLSearchParams(location.search).get('target')||'pickCode';let scanner;let sent=false;const st=document.getElementById('status');function msg(x){st.textContent=x}async function start(){try{if(scanner)return;scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:280,height:150}},async code=>{if(sent)return;sent=true;msg('Barcode terbaca: '+code);try{await scanner.stop()}catch(e){}window.opener?.postMessage({type:'CRISP_CHICK_BARCODE',code,target},'*');setTimeout(()=>window.close(),700)},()=>{});msg('Kamera aktif. Arahkan ke barcode Code 128.')}catch(e){sent=false;msg('Kamera gagal dibuka: '+(e.message||e)+' Pastikan izin kamera diberikan dan halaman HTTPS.')}}document.getElementById('start').onclick=start;window.addEventListener('load',start);</script></body></html>
