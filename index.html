<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Crisp Chick Scanner</title>

  <!-- BARCODE SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #111111,
          #1b1b1b
        );

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .app {

      width: 100%;

      max-width: 520px;

      text-align: center;

    }


    /* =========================
       LOGO
    ========================= */

    .logo {

      width: 120px;

      height: 120px;

      object-fit: contain;

      border-radius: 20px;

      margin-bottom: 12px;

    }


    .brand {

      font-size: 28px;

      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 5px;

    }


    .subtitle {

      color: #aaa;

      font-size: 14px;

      margin-bottom: 25px;

    }


    /* =========================
       SCANNER CARD
    ========================= */

    .card {

      background: #202020;

      border-radius: 25px;

      padding: 18px;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.55);

    }


    .camera-title {

      font-size: 16px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background: #000;

    }


    /* =========================
       STATUS
    ========================= */

    .status {

      margin-top: 18px;

      background: #151515;

      border-radius: 15px;

      padding: 15px;

    }


    .status-label {

      color: #999;

      font-size: 12px;

      margin-bottom: 6px;

    }


    #result {

      font-size: 21px;

      font-weight: 800;

      word-break: break-all;

    }


    /* =========================
       SUCCESS
    ========================= */

    .success {

      display: none;

      margin-top: 15px;

      padding: 15px;

      border-radius: 15px;

      background: #173b22;

      color: #8cffad;

      font-weight: bold;

    }


    /* =========================
       BUTTON
    ========================= */

    button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      margin-top: 15px;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }


    .close {

      background: #333;

      color: white;

    }


    .close:active {

      transform: scale(.98);

    }


  </style>

</head>


<body>


<div class="app">


  <!-- LOGO -->

  <img
    src="logo.jpg"
    class="logo"
    id="logo"
    alt="Crisp Chick"
    onerror="this.style.display='none';"
  >


  <div class="brand">
    CRISP CHICK
  </div>


  <div class="subtitle">
    Barcode Scanner
  </div>


  <div class="card">


    <div class="camera-title">
      Arahkan kamera ke barcode
    </div>


    <!-- CAMERA -->

    <div id="reader"></div>


    <!-- STATUS -->

    <div class="status">

      <div class="status-label">
        BARCODE TERBACA
      </div>

      <div id="result">
        Menunggu barcode...
      </div>

    </div>


    <!-- SUCCESS -->

    <div
      id="success"
      class="success"
    >
      ✓ Barcode berhasil dikirim ke Inventory
    </div>


    <!-- CLOSE -->

    <button
      class="close"
      onclick="closeScanner()"
    >
      TUTUP SCANNER
    </button>


  </div>


</div>



<script>


/* =====================================================
   VARIABLE
===================================================== */

let html5QrCode = null;

let alreadyScanned = false;


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


  try {


    html5QrCode =
      new Html5Qrcode("reader");


    await html5QrCode.start(

      {
        facingMode: "environment"
      },


      {

        fps: 10,

        qrbox: {

          width: 300,

          height: 150

        },

        aspectRatio: 1.777

      },


      onBarcodeSuccess,


      onBarcodeError

    );


    console.log(
      "CRISP CHICK CAMERA: AKTIF"
    );


  }


  catch(error) {


    console.error(
      "CAMERA ERROR:",
      error
    );


    document.getElementById(
      "result"
    ).innerText =
      "Kamera gagal dibuka";


    alert(

      "Kamera tidak dapat dibuka.\n\n" +

      "Pastikan:\n" +

      "✓ Website menggunakan HTTPS\n" +

      "✓ Izin kamera diberikan\n" +

      "✓ Gunakan Google Chrome\n" +

      "✓ Kamera tidak sedang dipakai aplikasi lain"

    );

  }

}



/* =====================================================
   BARCODE BERHASIL DIBACA
===================================================== */

async function onBarcodeSuccess(decodedText) {


  /* Cegah scan berkali-kali */

  if (alreadyScanned) {

    return;

  }


  alreadyScanned = true;


  const barcode =
    String(decodedText || "")
      .trim();


  console.log(
    "BARCODE TERBACA:",
    barcode
  );


  /* Tampilkan */

  document.getElementById(
    "result"
  ).innerText = barcode;


  /* Stop kamera */

  try {

    await html5QrCode.stop();

  }

  catch(error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  /* Kirim ke Apps Script */

  sendBarcode(barcode);

}



/* =====================================================
   ERROR SCAN
===================================================== */

function onBarcodeError(errorMessage) {

  // Jangan tampilkan error scanning.
  // html5-qrcode akan terus mencoba membaca.

}



/* =====================================================
   KIRIM BARCODE KE INVENTORY
===================================================== */

function sendBarcode(barcode) {


  console.log(
    "MENGIRIM BARCODE:",
    barcode
  );


  /* Pastikan scanner dibuka dari Inventory */

  if (!window.opener) {


    alert(

      "Scanner tidak terhubung ke Crisp Chick Inventory.\n\n" +

      "Buka scanner melalui tombol SCAN BARCODE di Inventory."

    );


    alreadyScanned = false;

    return;

  }


  /* =================================================
     POST MESSAGE
  ================================================= */

  window.opener.postMessage(

    {

      type:
        "CRISP_CHICK_BARCODE",

      code:
        barcode

    },

    "*"

  );


  console.log(
    "BARCODE TERKIRIM:",
    barcode
  );


  /* Tampilkan sukses */

  document.getElementById(
    "success"
  ).style.display = "block";


  /* Tutup scanner setelah 1 detik */

  setTimeout(

    function() {

      window.close();

    },

    1000

  );

}



/* =====================================================
   CLOSE
===================================================== */

async function closeScanner() {


  try {


    if (html5QrCode) {

      await html5QrCode.stop();

    }


  }

  catch(error) {

    console.log(error);

  }


  window.close();

}



/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function() {

    startCamera();

  }
);


</script>


</body>

</html>
