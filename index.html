<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Crisp Chick Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.logo {
  width: 130px;
  max-width: 60%;
  display: block;
  margin: 10px auto 20px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  opacity: .7;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  background: #000;
  border-radius: 15px;
  overflow: hidden;
}

.result {
  margin-top: 15px;
  background: #222;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: white;
  color: black;
}

.stop {
  background: #b00020;
  color: white;
}

.status {
  text-align: center;
  margin: 15px 0;
  opacity: .8;
}

</style>

</head>

<body>

<div class="container">

  <img
    src="./logo.jpg"
    class="logo"
    alt="Crisp Chick"
  >

  <h1>
    Scan Barcode
  </h1>

  <div class="subtitle">
    Crisp Chick Inventory
  </div>

  <div
    id="reader"
  ></div>

  <div
    id="status"
    class="status"
  >
    Kamera belum dimulai
  </div>

  <div
    id="result"
    class="result"
  >
    Arahkan kamera ke barcode
  </div>

  <button
    class="start"
    onclick="startScanner()"
  >
    📷 BUKA KAMERA
  </button>

  <button
    class="stop"
    onclick="stopScanner()"
  >
    ⏹ STOP KAMERA
  </button>

</div>


<script>

let html5QrCode = null;
let scannerRunning = false;
let scanned = false;


/* =========================================================
   START SCANNER
========================================================= */

function startScanner() {

  if (scannerRunning) {
    return;
  }

  scanned = false;

  document
    .getElementById('status')
    .textContent =
    'Memulai kamera...';

  html5QrCode =
    new Html5Qrcode(
      'reader'
    );

  const config = {

    fps: 10,

    qrbox: {
      width: 280,
      height: 140
    },

    aspectRatio: 1.7777778

  };

  html5QrCode

    .start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      scannerRunning = true;

      document
        .getElementById('status')
        .textContent =
        'Kamera aktif. Arahkan ke barcode.';

    })

    .catch(function(error) {

      console.error(error);

      scannerRunning = false;

      document
        .getElementById('status')
        .textContent =
        'Kamera tidak dapat dibuka.';

      document
        .getElementById('result')
        .textContent =
        'Pastikan izin kamera diberikan kepada browser dan buka halaman menggunakan HTTPS.';

    });

}


/* =========================================================
   SCAN SUCCESS
========================================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (scanned) {
    return;
  }

  if (!decodedText) {
    return;
  }

  scanned = true;

  const barcode =
    String(decodedText).trim();

  document
    .getElementById('result')
    .textContent =
    'Barcode: ' + barcode;

  document
    .getElementById('status')
    .textContent =
    'Barcode berhasil dibaca.';


  if (html5QrCode) {

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

        sendBarcode(barcode);

      })
      .catch(function() {

        scannerRunning = false;

        sendBarcode(barcode);

      });

  } else {

    sendBarcode(barcode);

  }

}


/* =========================================================
   SEND BARCODE TO APPS SCRIPT
========================================================= */

function(decodedText) {

    if (window.opener) {

        window.opener.postMessage(
            {
                type: "CRISP_CHICK_BARCODE",
                code: decodedText
            },
            "*"
        );

    }

}


/* =========================================================
   SCAN FAILURE
========================================================= */

function onScanFailure(error) {

  // Tidak perlu menampilkan error
  // setiap frame karena akan terlalu ramai.

}


/* =========================================================
   STOP
========================================================= */

function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

        document
          .getElementById('status')
          .textContent =
          'Kamera dihentikan.';

      })
      .catch(function(error) {

        console.error(error);

        scannerRunning = false;

      });

  }

}

</script>

</body>
</html>
