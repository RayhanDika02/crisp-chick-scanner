<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
CRISP CHICK — Barcode Scanner
</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top,
      rgba(226,27,45,.22),
      transparent 40%
    ),
    #080b10;

  color:white;

  font-family:
    Inter,
    Arial,
    sans-serif;
}

.scanner-card{

  width:
    min(440px,100%);

  padding:24px;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:26px;

  background:
    rgba(16,21,29,.96);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.55);
}

.logo{

  width:58px;
  height:58px;

  display:grid;
  place-items:center;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      #ff3a4e,
      #9d0b19
    );

  font-weight:900;

  margin-bottom:15px;
}

h1{

  margin:0;

  font-size:24px;
}

.subtitle{

  color:#9ca6b5;

  font-size:12px;

  margin-top:6px;

  margin-bottom:20px;
}

#reader{

  width:100%;

  overflow:hidden;

  border-radius:18px;

  background:#05070a;
}

button{

  width:100%;

  margin-top:14px;

  padding:14px;

  border:0;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ff3d50,
      #d71629
    );

  color:white;

  font-weight:800;

  cursor:pointer;
}

.status{

  margin-top:14px;

  padding:13px;

  border-radius:13px;

  background:#0d1219;

  border:
    1px solid
    rgba(255,255,255,.08);

  color:#b8c0cc;

  font-size:12px;

  line-height:1.5;
}

.result{

  margin-top:14px;

  padding:15px;

  border-radius:13px;

  background:#10271a;

  border:
    1px solid
    #245d3b;

  text-align:center;

  font-weight:800;

  display:none;
}

</style>

</head>


<body>

<div class="scanner-card">

  <div class="logo">
    CC
  </div>

  <h1>
    CRISP CHICK
  </h1>

  <div class="subtitle">
    Barcode Scanner • Pickup Verification
  </div>

  <div id="reader"></div>

  <button
    id="startButton"
    onclick="startScanner()"
  >
    AKTIFKAN KAMERA
  </button>

  <div
    id="status"
    class="status"
  >
    Tekan tombol untuk mengaktifkan kamera.
  </div>

  <div
    id="result"
    class="result"
  ></div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const orderId =
  params.get('orderId') || '';

const returnOrigin =
  params.get('returnOrigin') || '';

const returnUrl =
  params.get('returnUrl') || '';

let scanner = null;

let alreadySent = false;


/* ======================================================
   STATUS
====================================================== */

function setStatus(text){

  document
    .getElementById('status')
    .textContent = text;

}


/* ======================================================
   START CAMERA
====================================================== */

function startScanner(){

  if(scanner){

    setStatus(
      'Scanner sudah aktif.'
    );

    return;
  }

  scanner =
    new Html5Qrcode(
      'reader'
    );


  const formats = [

    Html5QrcodeSupportedFormats.CODE_128,

    Html5QrcodeSupportedFormats.CODE_39,

    Html5QrcodeSupportedFormats.CODE_93,

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E,

    Html5QrcodeSupportedFormats.ITF,

    Html5QrcodeSupportedFormats.QR_CODE

  ];


  const config = {

    fps:10,

    qrbox:{
      width:280,
      height:150
    },

    formatsToSupport:
      formats

  };


  scanner.start(

    {
      facingMode:
        'environment'
    },

    config,

    handleScan,

    function(errorMessage){

      // ignore scan errors
    }

  )

  .then(function(){

    setStatus(
      'Kamera aktif. Arahkan barcode ke area scanner.'
    );

  })

  .catch(function(error){

    setStatus(
      'Kamera gagal dibuka: ' +
      error
    );

  });

}


/* ======================================================
   BARCODE BERHASIL TERBACA
====================================================== */

function handleScan(
  decodedText
){

  if(alreadySent){
    return;
  }

  alreadySent = true;

  const barcode =
    String(
      decodedText || ''
    ).trim();

  document
    .getElementById('result')
    .style.display = 'block';

  document
    .getElementById('result')
    .textContent =
      barcode;


  setStatus(
    'Barcode berhasil dibaca. Mengirim ke aplikasi...'
  );


  const message = {

    type:
      'CRISP_CHICK_BARCODE',

    barcode:
      barcode,

    orderId:
      orderId

  };


  /*
   * KIRIM KE GOOGLE APPS SCRIPT
   */

  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      window.opener.postMessage(

        message,

        returnOrigin ||
        '*'

      );

    }

  }catch(error){

    console.error(error);

  }


  /*
   * FALLBACK
   *
   * Jika popup/opener hilang,
   * hasil scan dikirim melalui URL.
   */

  setTimeout(function(){

    if(returnUrl){

      try{

        const url =
          new URL(
            returnUrl
          );

        url.searchParams.set(
          'scannerBarcode',
          barcode
        );

        url.searchParams.set(
          'scannerOrderId',
          orderId
        );

        window.location.href =
          url.toString();

      }catch(error){

        console.error(error);

      }

    }else{

      try{

        window.close();

      }catch(error){}

    }

  },1200);

}

</script>

</body>

</html>
