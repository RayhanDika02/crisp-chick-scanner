<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CRISP CHICK - Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #281015,
          #07090d 55%
        );
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .brand {
      text-align: center;
      margin: 20px 0;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: auto;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          145deg,
          #ff3347,
          #9d0d1d
        );
      font-weight: 900;
      font-size: 20px;
    }

    h1 {
      margin-top: 15px;
      font-size: 23px;
    }

    .subtitle {
      color: #929baa;
      font-size: 12px;
    }

    .scanner-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 15px;
      backdrop-filter: blur(15px);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      background:
        linear-gradient(
          135deg,
          #ff3347,
          #e21b2d
        );
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      font-size: 12px;
      word-break: break-all;
    }

    .status {
      margin-top: 10px;
      color: #9ca6b5;
      text-align: center;
      font-size: 11px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="brand">

      <div class="logo">
        CC
      </div>

      <h1>
        CRISP CHICK
      </h1>

      <div class="subtitle">
        Barcode Scanner
      </div>

    </div>


    <div class="scanner-card">

      <div id="reader"></div>

      <button
        id="startButton"
        class="button"
      >
        AKTIFKAN KAMERA
      </button>

      <div
        id="result"
        class="result"
      >
        Belum ada barcode.
      </div>

      <div
        id="status"
        class="status"
      >
        Tekan tombol jika kamera belum aktif.
      </div>

    </div>

  </div>


<script>

  const params =
    new URLSearchParams(
      window.location.search
    );

  const orderId =
    params.get('orderId') || '';

  const returnOrigin =
    params.get('returnOrigin') || '';

  const returnUrl =
    params.get('returnUrl') || '';

  let scanner = null;

  let scanned = false;


  const formats = [

    Html5QrcodeSupportedFormats.CODE_128,

    Html5QrcodeSupportedFormats.CODE_39,

    Html5QrcodeSupportedFormats.CODE_93,

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E,

    Html5QrcodeSupportedFormats.ITF,

    Html5QrcodeSupportedFormats.QR_CODE

  ];


  async function startScanner() {

    if (scanner) {
      return;
    }

    scanned = false;

    document.getElementById(
      'status'
    ).textContent =
      'Memulai kamera...';

    scanner =
      new Html5Qrcode(
        'reader'
      );

    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 160
      },

      aspectRatio: 1.0,

      formatsToSupport: formats

    };

    try {

      await scanner.start(

        {
          facingMode: 'environment'
        },

        config,

        function(decodedText) {

          if (scanned) {
            return;
          }

          scanned = true;

          handleScan(
            decodedText
          );

        },

        function(errorMessage) {
          // Ignore scanning errors.
        }

      );

      document.getElementById(
        'status'
      ).textContent =
        'Arahkan kamera ke barcode barang.';

    } catch (error) {

      scanner = null;

      document.getElementById(
        'status'
      ).textContent =
        'Kamera gagal dibuka. Pastikan izin kamera diberikan.';

      document.getElementById(
        'result'
      ).textContent =
        error;

    }

  }


  async function handleScan(barcode) {

    barcode =
      String(barcode || '').trim();

    document.getElementById(
      'result'
    ).textContent =
      'Barcode: ' + barcode;

    document.getElementById(
      'status'
    ).textContent =
      'Barcode berhasil dibaca. Mengirim ke aplikasi...';


    const message = {

      type:
        'CRISP_CHICK_BARCODE',

      barcode:
        barcode,

      orderId:
        orderId

    };


    /*
     * PRIMARY:
     * kirim hasil scan ke window aplikasi utama
     */

    if (
      window.opener &&
      !window.opener.closed
    ) {

      try {

        window.opener.postMessage(
          message,
          returnOrigin || '*'
        );

      } catch (error) {

        console.log(error);

      }

    }


    /*
     * FALLBACK:
     * redirect kembali ke aplikasi
     */

    if (returnUrl) {

      setTimeout(
        function() {

          const separator =
            returnUrl.includes('?')
              ? '&'
              : '?';

          const url =
            returnUrl +
            separator +
            'scannerBarcode=' +
            encodeURIComponent(barcode) +
            '&scannerOrderId=' +
            encodeURIComponent(orderId);

          window.location.href =
            url;

        },
        1200
      );

    }

  }


  document
    .getElementById(
      'startButton'
    )
    .addEventListener(
      'click',
      startScanner
    );


  window.addEventListener(
    'load',
    function() {

      /*
       * Jangan langsung membuka kamera.
       * User menekan tombol agar browser
       * mengizinkan camera permission.
       */

      document.getElementById(
        'status'
      ).textContent =
        orderId
          ? 'Order: ' + orderId
          : 'Siap melakukan scan.';

    }
  );

</script>

</body>
</html>
