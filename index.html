<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Crisp Chick Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 130px;
      max-width: 60%;
      margin-bottom: 15px;
      border-radius: 15px;
    }

    h1 {
      margin: 5px 0;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    .scanner-box {
      background: #1b1b1b;
      border-radius: 22px;
      padding: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,.5);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #252525;
      font-size: 14px;
    }

    .code {
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      border: 0;
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      background: #333;
      color: white;
    }

  </style>
</head>

<body>

<div class="container">

  <img
    src="logo.jpg"
    class="logo"
    onerror="this.style.display='none';"
  >

  <h1>CRISP CHICK</h1>

  <div class="subtitle">
    Barcode Scanner
  </div>

  <div class="scanner-box">

    <div id="reader"></div>

    <div class="status">
      Arahkan kamera ke barcode
      <div id="result" class="code">
        Menunggu barcode...
      </div>
    </div>

    <button
      class="close-btn"
      onclick="closeScanner()">
      TUTUP SCANNER
    </button>

  </div>

</div>


<script>

let scanner = null;
let scanned = false;


/* =========================================
   MULAI KAMERA
========================================= */

function startScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 300,
        height: 150
      },

      aspectRatio: 1.777
    },

    function(decodedText) {

      if (scanned) return;

      scanned = true;

      console.log("BARCODE:", decodedText);

      document.getElementById("result").innerText =
        decodedText;

      sendBarcodeToAppsScript(decodedText);

    },

    function(errorMessage) {

      // Abaikan error scanning sementara

    }

  )

  .then(function() {

    console.log("Kamera berhasil dibuka");

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById("result").innerText =
      "Kamera tidak dapat dibuka";

    alert(
      "Kamera tidak dapat dibuka.\n\n" +
      "Pastikan:\n" +
      "1. Website menggunakan HTTPS\n" +
      "2. Izin kamera diberikan\n" +
      "3. Gunakan Chrome\n" +
      "4. Kamera tidak sedang digunakan aplikasi lain"
    );

  });

}


/* =========================================
   KIRIM BARCODE KE APPS SCRIPT
========================================= */

function sendBarcodeToAppsScript(code) {

  if (!window.opener) {

    alert(
      "Scanner tidak menemukan halaman Crisp Chick Inventory."
    );

    return;

  }

  window.opener.postMessage(

    {
      type: "CRISP_CHICK_BARCODE",
      code: code
    },

    "https://script.google.com"

  );

  setTimeout(function() {

    closeScanner();

  }, 700);

}


/* =========================================
   TUTUP SCANNER
========================================= */

function closeScanner() {

  if (scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

        window.close();

      })
      .catch(function() {

        window.close();

      });

  } else {

    window.close();

  }

}


/* =========================================
   JALANKAN KAMERA
========================================= */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
